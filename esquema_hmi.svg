<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <!-- Fondo Base Industrial -->
  <rect width="1200" height="680" fill="#0b1120" />

  <!-- ================= FRONTERA SUPERIOR: SINÓPTICO DEL PROCESO ================= -->
  <rect x="20" y="15" width="1160" height="365" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="40" y="42" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="1">ARQUITECTURA DE ENCLAVAMIENTO Y SUPERVISIÓN ELÉCTRICA (SINÓPTICO SCADA)</text>

  <!-- Red Eléctrica Taller -->
  <rect x="45" y="135" width="160" height="145" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2.5" />
  <text x="125" y="195" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">RED TALLER</text>
  <text x="125" y="228" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="22" font-weight="bold">220 VAC</text>
  <line x1="205" y1="207" x2="290" y2="207" stroke="#ef4444" stroke-width="6" />

  <!-- Gabinete Cautivo IP65 -->
  <rect x="290" y="55" width="590" height="305" rx="12" fill="#161f30" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="10,5" />
  <text x="585" y="83" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="bold">GABINETE INTERMEDIO CAUTIVO IP65 (ANTI-BYPASS)</text>

  <!-- Controlador ESP32 + RTC -->
  <rect x="315" y="102" width="235" height="95" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
  <text x="432" y="138" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="15" font-weight="bold">ESP32 + RTC DS3231</text>
  <text x="432" y="164" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Validación TOTP / Telemetría</text>

  <!-- Bloque Contactor K1 (Espacio dedicado abajo) -->
  <rect x="315" y="212" width="235" height="130" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="2" />
  <text x="432" y="238" text-anchor="middle" fill="#fde047" font-family="sans-serif" font-size="15" font-weight="bold">CONTACTOR K1 (ESTADO)</text>

  <!-- Bloque Sensor PZEM-004T (Espacio dedicado para V, A, W) -->
  <rect x="580" y="102" width="275" height="240" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="2" />
  <text x="717" y="130" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="bold">SENSOR PZEM-004T (EN VIVO)</text>

  <!-- Líneas de Potencia -->
  <line x1="550" y1="277" x2="580" y2="277" stroke="#64748b" stroke-width="6" />
  <line x1="880" y1="207" x2="965" y2="207" stroke="#64748b" stroke-width="6" />

  <!-- Bloque Maqueta Didáctica INACAP -->
  <rect x="965" y="135" width="185" height="145" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2.5" />
  <text x="1057" y="192" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">MAQUETA INACAP</text>
  <text x="1057" y="220" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Planta Didáctica</text>

  <!-- ================= ZONA INFERIOR IZQUIERDA: 5 KPI DEDICADOS ================= -->
  <rect x="20" y="395" width="565" height="270" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <text x="40" y="422" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="1">INDICADORES CLAVE DE RENDIMIENTO (KPI OPERACIONALES)</text>

  <!-- Fila 1 de Cajas KPI (3 espacios) -->
  <rect x="35" y="438" width="170" height="100" rx="8" fill="#161f30" stroke="#1e293b" stroke-width="1.5" />
  <rect x="217" y="438" width="170" height="100" rx="8" fill="#161f30" stroke="#1e293b" stroke-width="1.5" />
  <rect x="399" y="438" width="170" height="100" rx="8" fill="#161f30" stroke="#1e293b" stroke-width="1.5" />

  <!-- Fila 2 de Cajas KPI (2 espacios centrados) -->
  <rect x="115" y="550" width="180" height="100" rx="8" fill="#161f30" stroke="#1e293b" stroke-width="1.5" />
  <rect x="315" y="550" width="180" height="100" rx="8" fill="#161f30" stroke="#1e293b" stroke-width="1.5" />

  <!-- ================= ZONA INFERIOR DERECHA: GRÁFICO DEDICADO ================= -->
  <rect x="600" y="395" width="580" height="270" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <text x="620" y="422" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="1">TENDENCIA HISTÓRICA: POTENCIA (W) VS CORRIENTE (A)</text>
  <rect x="615" y="435" width="550" height="218" rx="8" fill="#161f30" stroke="#1e293b" stroke-width="1.5" />
</svg>
